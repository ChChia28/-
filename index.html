<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EFEFEA; --card:#FFFFFF; --ink:#0E1013; --ink2:#3A3D44; --sub:#9A9CA1;
  --lime:#D6FF3F; --limeDeep:#B9E521; --dark:#101216; --soft:#E4E4DE; --line:#EDEDE8;
  --r:30px;
  --sh:0 22px 44px -26px rgba(14,16,19,.45), 0 3px 10px rgba(14,16,19,.05);
  --shHi:0 30px 60px -28px rgba(14,16,19,.55), 0 4px 14px rgba(14,16,19,.07);
}
html,body{margin:0;padding:0;background:#EFEFEA;color-scheme:light}
body{background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:26px 18px 150px;position:relative;overflow-x:hidden}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
::-webkit-scrollbar{width:0;height:0}
.hero{position:relative;padding:14px 6px 26px;margin-bottom:4px}
.ghost{position:absolute;right:-6px;top:-34px;font-size:150px;font-weight:800;letter-spacing:-.08em;line-height:1;color:#DFDFD8;user-select:none;pointer-events:none}
.hero h1{position:relative;font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:.98;margin:0}
.hero .meta{position:relative;margin-top:12px;font-size:13.5px;color:var(--sub);font-weight:500}
.hero .meta b{color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px 14px}
.stat .n{font-size:32px;font-weight:800;letter-spacing:-.05em;line-height:1}

// —— 持久化：优先 Anthropic storage → 掉到 localStorage → 最后内存 ——
async function sGet(k,sh){
  try{const r=await window.storage.get(k,!!sh);return r?r.value:null}
  catch(e){
    try{const v=localStorage.getItem(k);return v!==null?v:(mem[k]!==undefined?mem[k]:null);}
    catch(_){return mem[k]!==undefined?mem[k]:null;}
  }
}
async function sSet(k,v,sh){
  try{await window.storage.set(k,v,!!sh)}
  catch(e){
    try{localStorage.setItem(k,v);}
    catch(_){mem[k]=v;}  // 私隐/无痕模式或超配额时退到内存
  }
}
async function sDel(k,sh){
  try{await window.storage.delete(k,!!sh)}catch(e){}
  try{localStorage.removeItem(k);}catch(_){}
  delete mem[k];
}
async function sList(prefix,sh){
  try{const r=await window.storage.list(prefix,!!sh);if(r&&r.keys)return r;}catch(e){}
  // localStorage 备份 —— shared 键在这里读不到（因为 localStorage 是每域每浏览器独立）
  try{
    const keys=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(prefix)===0)keys.push(k);}
    return {keys};
  }catch(_){return {keys:[]};}
}

  for(const[r,e]of m)if(r.test(s))return e;return '🎯';

function parseTask(raw){
  let s=' '+raw.trim()+' ',days=null,time=null,target=0,unit='',cut=[];
  const rx=x=>new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  if(/工作日|上班日|周一到周五|weekday|mon-fri/i.test(s)){days=[1,2,3,4,5];cut.push(/工作日|上班日|周一到周五|weekdays?|mon-fri/gi);}
  else if(/周末|双休|weekend/i.test(s)){days=[0,6];cut.push(/周末|双休|weekends?/gi);}
  else{
    const wk=s.match(/周[一二三四五六日天]/g);
    if(wk){const mp={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
      days=[...new Set(wk.map(w=>mp[w[1]]))];cut.push(/每?周[一二三四五六日天]、?/g);}
  }
  let off=0;
  if(/下午|傍晚|晚上|夜里|睡前|今晚|\bpm\b|evening|night|tonight/i.test(s))off=12;
  const ap=s.match(/(\d{1,2})\s*(?::|：|点)\s*(\d{1,2})?/)||s.match(/\b(\d{1,2})\s*(am|pm)\b/i);
  if(ap){let h=+ap[1];const mi=+(ap[2]&&!isNaN(ap[2])?ap[2]:0);
    if(/pm/i.test(ap[2]||'')&&h<12)h+=12; else if(/am/i.test(ap[2]||'')&&h===12)h=0;
    else if(off&&h<12)h+=12;
    time=pad(Math.min(h,23))+':'+pad(Math.min(mi,59));cut.push(rx(ap[0]));}
  const du=s.match(/(\d+)\s*(分钟|小时|个小时|min(?:ute)?s?|hours?|hrs?|h\b)/i);
  if(du){target=+du[1]*(/小时|hour|hr|^h$/i.test(du[2])?60:1);unit=LI()?'min':'分钟';cut.push(rx(du[0]));}
  else{const cn=s.match(/(\d+)\s*(杯|次|页|个|篇|道|组|公里|千米|km|下|cups?|pages?|reps?|times?|words?|km)/i);
    if(cn){target=+cn[1];unit=cn[2];cut.push(rx(cn[0]));}}
  let title=s;cut.forEach(r=>title=title.replace(r,' '));
  title=title.replace(/每天|每日|天天|早上|上午|中午|下午|晚上|夜里|睡前|提醒我?|记得|我要|要去?|打卡|一下|之前|前|半/g,' ')
    .replace(/\b(every ?day|daily|each day|remind me( to)?|i want to|i will|go|at|in the|morning|afternoon|evening|night|tonight|am|pm)\b/gi,' ')
    .replace(/\s+/g,LI()?' ':'').trim();
  if(!title)title=raw.trim().slice(0,14)||(LI()?'New task':'新任务');
  return {title,days,time,target,unit:target?unit:'',type:target?'count':'bool',icon:iconFor(title)};
}

function dueTasks(k){k=k||todayKey();const d=dow(k);return S.tasks.filter(x=>!x.arch&&x.days.includes(d)&&x.start<=k);}
function log(k,id){return (S.logs[k]||{})[id]||null;}
function isDone(k,x){const l=log(k,x.id);if(!l)return false;return x.type==='count'?(l.count||0)>=x.target:!!l.done;}
function dayRate(k){const d=dueTasks(k);if(!d.length)return null;return d.filter(x=>isDone(k,x)).length/d.length;}
function totalDone(s){let n=0;for(const k in s.logs)for(const i in s.logs[k]){const l=s.logs[k][i];if(l.done||l.count)n++;}return n;}
function countPics(s){let n=0;for(const k in s.logs)for(const i in s.logs[k])if(s.logs[k][i].img)n++;return n;}
function recomputeStreak(){
  const prev=S.streak.cur||0;let k=todayKey(),cur=0;
  if(dayRate(k)===1)cur=1;
  k=dayAdd(k,-1);
  for(let i=0;i<500;i++){const r=dayRate(k);if(r===null){k=dayAdd(k,-1);continue;}if(r===1)cur++;else break;k=dayAdd(k,-1);}
  S.streak.cur=cur;S.streak.best=Math.max(S.streak.best,cur);
  if(prev>=3&&cur===0&&S.streak.noticed!==todayKey()){S.streak.noticed=todayKey();
    setTimeout(()=>{if(!S.set.gentle) playBreakAnimation(prev); toast(S.set.gentle?t('tStreakG',prev):pk('brk').split('{n}').join(prev));},1500);}
}
function checkBadges(){
  const got=[];BADGES.forEach(b=>{if(!S.badges.includes(b.id)&&b.c(S)){S.badges.push(b.id);got.push(b.e+' '+b.n[LI()]);}});
  if(got.length)setTimeout(()=>toast(t('tBadge',got.join(', '))),700);
}
function rangeStats(from,to){
  let tot=0,dn=0,det={},days=[],run=0,best=0;
  if(from<S.created)from=S.created;
  for(let k=from;k<=to;k=dayAdd(k,1)){
    const due=dueTasks(k),d=due.filter(x=>isDone(k,x)).length;
    tot+=due.length;dn+=d;days.push({k,due:due.length,done:d});
    if(due.length&&d===due.length){run++;best=Math.max(best,run);}else if(due.length)run=0;
    due.forEach(x=>{det[x.id]=det[x.id]||{t:x,due:0,done:0};det[x.id].due++;if(isDone(k,x))det[x.id].done++;});
  }
  const arr=Object.values(det).filter(x=>x.due>=2).sort((a,b)=>(b.done/b.due)-(a.done/a.due));
  return {tot,dn,rate:tot?dn/tot:0,days,best:arr[0],worst:arr[arr.length-1],streak:best};
}
function verdict(kind,rate,checks){
  const tiers=VERDICT[kind][LI()];
  const hit=tiers.find(([lim])=>rate>=lim||lim===0);
  const cands=tiers.filter(([lim])=>lim===hit[0]);
  const txt=pick(cands)[1];
  return txt.split('{P}').join(Math.round(rate*100)).split('{N}').join(checks);
}

const stepOf=x=>x.target>=30?5:1;
function shrink(file,max=780,q=.62){return new Promise(res=>{const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height));
    const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};i.src=r.result;};
  r.readAsDataURL(file);});}

/* ===================== 奖励 ===================== */
function lastDoneKey(id){
  const keys=Object.keys(S.logs||{}).sort().reverse();
  for(const k of keys){const l=(S.logs[k]||{})[id];if(l && (l.done || (l.count||0)>0)) return k;}
  return null;
}
function daysBetween(a,b){return Math.round((dateOf(b).getTime()-dateOf(a).getTime())/864e5);}
function coldShoulder(x){
  if(S.set.gentle) return '';
  const last=lastDoneKey(x.id);
  const start=x.start||todayKey();
  const from=last||start;
  const gap=daysBetween(from, todayKey());
  if(gap < 3) return '';
  const zh=[[3,`${gap} 天没碰它了。`],[5,`${gap} 天没做，装看不见？`],[7,'一周了。这条已经进入昏迷状态。'],[10,`${gap} 天了。你确定还打算做这件事？`],[14,'两周没动。删了它对彼此都好。'],[21,`${gap} 天。你已经算是抛弃它了。`],[30,'一个月。它已经不认识你了。'],[45,`${gap} 天。这条任务在等你的道歉。`],[60,'两个月。你当初怎么想的，还记得吗？'],[90,'三个月。它已经死了，你还留着它当纪念？']];
  const en=[[3,`Untouched for ${gap} days.`],[5,`${gap} days ignored. Pretending it's not there?`],[7,"A week. This one's in a coma."],[10,`${gap} days. Sure you still plan to do this?`],[14,'Two weeks untouched. Delete it. Kinder for both of you.'],[21,`${gap} days. You've effectively abandoned it.`],[30,"A month. It doesn't recognize you anymore."],[45,`${gap} days. This task is waiting for an apology.`],[60,'Two months. Remember why you added it?'],[90,"Three months. It's dead. You're keeping a corpse."]];
  const arr = LI()?en:zh;
  let hit=arr[0][1];
  for(const [d,tt] of arr) if(gap>=d) hit=tt;
  return hit;
}
function attachLongPress(el, longCb, tapCb, ignoreFn){
  let timer=null, longFired=false, startPt=null;
  const THRESHOLD=450, MOVE_TOL=10;
  const start = e => {
    if(ignoreFn && ignoreFn(e)) return;
    longFired=false;
    const t = e.touches ? e.touches[0] : e;
    startPt = {x: t.clientX, y: t.clientY};
    timer = setTimeout(()=>{
      longFired = true;
      timer = null;
      if(navigator.vibrate) try{navigator.vibrate(30);}catch(_){}
      longCb();
    }, THRESHOLD);
  };
  const move = e => {
    if(!timer || !startPt) return;
    const t = e.touches ? e.touches[0] : e;
    if(Math.abs(t.clientX-startPt.x)>MOVE_TOL || Math.abs(t.clientY-startPt.y)>MOVE_TOL){
      clearTimeout(timer); timer = null;
    }
  };
  const end = () => {
    if(timer){ clearTimeout(timer); timer=null; }
  };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', move, {passive:true});
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', start);
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('click', ev=>{
    if(longFired){ ev.preventDefault(); ev.stopPropagation(); longFired=false; return; }
    if(ignoreFn && ignoreFn(ev)) return;
    if(tapCb) tapCb(ev);
  });
}

function attachHoldRepeat(btn, action){
  let holdTimer=null, rapidTimer=null, tickCount=0;
  const start = e => {
    e.preventDefault && e.preventDefault();
    action(); tickCount=1;
    holdTimer = setTimeout(()=>{
      // 300ms后开始快速
      rapidTimer = setInterval(()=>{
        action(); tickCount++;
        if(tickCount > 15 && rapidTimer){
          clearInterval(rapidTimer);
          // 加速阶段
          rapidTimer = setInterval(()=>{action();tickCount++;},50);
          if(tickCount > 40){
            clearInterval(rapidTimer);
            rapidTimer = setInterval(()=>{action();tickCount++;},25);
          }
        }
      }, 110);
    }, 350);
  };
  const stop = () => {
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
    if(rapidTimer){clearInterval(rapidTimer);rapidTimer=null;}
    tickCount=0;
  };
  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start, {passive:false});
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchend', stop);
  btn.addEventListener('touchcancel', stop);
}
function attachSwipe(wrap, onDelete){
  const card = wrap.querySelector('.task, .rw');
  if(!card) return;
  let startX=null, startY=null, currentX=0, revealed=false, swiping=false, timer=null;
  const REVEAL=88, THRESHOLD=40;
  const start = e => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    swiping = false;
    card.style.transition='none';
  };
  const move = e => {
    if(startX==null) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(!swiping){
      if(Math.abs(dy) > 12){ startX=null; return; }
      if(Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) swiping=true;
    }
    if(swiping){
      // 支持向左滑；已展开时允许向右收回
      const base = revealed ? -REVEAL : 0;
      const target = Math.max(-REVEAL-20, Math.min(0, base + dx));
      card.style.transform=`translateX(${target}px)`;
      if(e.cancelable) e.preventDefault && e.preventDefault();
    }
  };
  const end = e => {
    if(startX==null) return;
    startX=null;
    if(!swiping) return;
    swiping=false;
    card.style.transition='transform .22s cubic-bezier(.22,1,.36,1)';
    const now = parseFloat((card.style.transform.match(/-?\d+(\.\d+)?/)||[0])[0]) || 0;
    if(now < -THRESHOLD){
      card.style.transform=`translateX(-${REVEAL}px)`;
      revealed=true;
    }else{
      card.style.transform='translateX(0)';
      revealed=false;
    }
  };
  card.addEventListener('touchstart', start, {passive:true});
  card.addEventListener('touchmove', move, {passive:false});
  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);
  card.addEventListener('mousedown', start);
  card.addEventListener('mousemove', move);
  card.addEventListener('mouseup', end);
  card.addEventListener('mouseleave', ()=>{ if(startX!==null) end(); });
  // 点击外面收回
  document.addEventListener('click', ev=>{
    if(revealed && !wrap.contains(ev.target)){
      card.style.transition='transform .22s cubic-bezier(.22,1,.36,1)';
      card.style.transform='translateX(0)';
      revealed=false;
    }
  });
  wrap.querySelector('.swipeAction').onclick=ev=>{
    ev.stopPropagation();
    onDelete();
  };
}

    D('sheet').querySelector('#okimp').onclick=async()=>{

      S.set=Object.assign(defaults().set,pack.state.set||{});
      S.streak=Object.assign({cur:0,best:0,noticed:null},pack.state.streak||{});
      await sSet(KEY,JSON.stringify(S));
      const imgs=pack.images||{};
      for(const k in imgs){ try{ await sSet(k,imgs[k]); }catch(e){} }
      recomputeStreak(); closeSheet(); render();
      toast(LI()?'Imported. Welcome back.':'导入完成，欢迎回来。');
    };
  };
  inp.click();
}

function viewReward(){
  const L=T.lvNames[LI()];
  const lv=S.points>=5000?[L[4],'🏆']:S.points>=2000?[L[3],'🔥']:S.points>=800?[L[2],'⚡']:S.points>=200?[L[1],'🌱']:[L[0],'🐣'];
  ensureDefaultRewards();
  D('view').innerHTML=`<div class="hero"><div class="ghost">${lv[1]}</div><h1>${t('heroReward')}</h1>
    <div class="meta">${t('lvLabel',lv[0],S.freeze)}</div></div>
  <div class="bigpoint"><div class="n">${S.points}</div><div class="l">${t('ptsAvail',totalDone(S))}</div></div>
  <div class="rw"><div class="e">🎲</div><div class="m"><b>${t('boxTitle')}</b><em>${t('boxDesc')}</em></div>
    <button class="go ${S.points<60?'no':''}" id="box">${t('boxOpen')}</button></div>
  <div class="shead"><h2>${t('myRewards')}</h2><span>${t('rwLongHint')}</span></div><div id="rws"></div>
  <button class="btn ghost" id="addrw">${t('addReward')}</button>
  <div class="shead"><h2>${t('badgesT')}</h2><span>${S.badges.length}/${BADGES.length}</span></div>
  <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges.includes(b.id)?'got':''}"><div class="e">${b.e}</div><div class="t">${b.n[LI()]}</div></div>`).join('')}</div>
`;
  D('rws').innerHTML=S.rewards.map((r,i)=>`<div class="swipeWrap rwWrap">
    <div class="swipeAction">${LI()?'Delete':'删除'}</div>
    <div class="rw" data-i="${i}"><div class="e">${r.e}</div>
      <div class="m"><b>${esc(r.t)}</b><em>${r.c} ${LI()?'pts':'分'}${r.got?' · '+t('rwGot',r.got):''}</em></div>
      <button class="go ${S.points<r.c?'no':''}" data-i="${i}">${t('redeem')}</button>
    </div>
  </div>`).join('');
  D('rws').querySelectorAll('.rw').forEach(row=>{
    const i = +row.dataset.i;
    const goBtn = row.querySelector('.go');
    goBtn.onclick=ev=>{ev.stopPropagation();const r=S.rewards[i];
      if(S.points<r.c)return toast(S.set.gentle?t('tPoorG'):t('tPoor'));
      S.points-=r.c;r.got=(r.got||0)+1;save();render();toast(S.set.gentle?t('tRedeemG'):t('tRedeem',r.t));};
    attachLongPress(row, ()=>openRewardMenu(i), null, e=>e.target.closest('.go'));
    const wrap = row.closest('.swipeWrap');
    if(wrap) attachSwipe(wrap, ()=>{S.rewards.splice(i,1);save();render();toast(LI()?'Deleted.':'删了。');});
  });
  D('addrw').onclick=()=>{
    sheet(`<h3>${t('rwWant')}</h3>
      <div class="field"><label>${t('rwWhat')}</label><input id="rt" placeholder="${t('rwWhatPh')}"></div>
      <div class="row"><div class="field"><label>${t('rwEmoji')}</label><input id="re" value="🎁"></div>
      <div class="field"><label>${t('rwCost')}</label><input id="rc" inputmode="numeric" value="300"></div></div>
      <p class="hint">${t('rwHint')}</p><button class="btn lime" id="ok">${t('rwAdd')}</button>`);
    D('sheet').querySelector('#ok').onclick=()=>{const v=D('sheet').querySelector('#rt').value.trim();if(!v)return toast(t('tWant'));
      S.rewards.push({e:D('sheet').querySelector('#re').value.trim()||'🎁',t:v,c:Math.max(10,parseInt(D('sheet').querySelector('#rc').value)||300)});
      save();closeSheet();render();};};
  D('box').onclick=()=>{
    if(S.points<60)return toast(S.set.gentle?t('tPoorG'):t('tBoxPoor'));
    S.points-=60;S.boxes++;const roll=Math.random();let o;
    const Z=LI();
    if(roll<.34)o={e:'🪙',t:'+20',f:()=>S.points+=20,d:Z?'Floor prize. Not a total loss.':'保底。没亏光。'};
    else if(roll<.58)o={e:'💰',t:'+50',f:()=>S.points+=50,d:Z?'Small win.':'小赚。'};
    else if(roll<.74)o={e:'💎',t:'+120',f:()=>S.points+=120,d:Z?'Good pull.':'手气不错。'};
    else if(roll<.80)o={e:'👑',t:'+300',f:()=>S.points+=300,d:Z?'Rare. Spend it well.':'稀有。别乱花。'};
    else if(roll<.92)o={e:'🛡',t:Z?'Skip pass ×1':'免鸽卡 ×1',f:()=>S.freeze++,d:Z?'Covers the day you break.':'断签那天自动顶上。'};
    else o={e:'🌫',t:Z?'Nothing':'空的',f:()=>{},d:Z?'Empty. This is exactly how you get hooked.':'什么都没有。你就是这么被钓住的。'};
    o.f();checkBadges();save();
    sheet(`<div class="pop"><div class="e">${o.e}</div><h4>${o.t}</h4><p>${o.d}<br>${S.points} ${Z?'left':'分剩余'}</p></div>
      <button class="btn lime" id="a">${t('boxAgain')}</button><button class="btn ghost" id="b">${t('boxStop')}</button>`);
    D('sheet').querySelector('#a').onclick=()=>{closeSheet();setTimeout(()=>{render();D('box').click();},240);};
    D('sheet').querySelector('#b').onclick=()=>{closeSheet();render();};};
}

/* ===================== 战报：周 / 季 / 年 ===================== */
function weekKeyOf(k){const d=dateOf(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return todayKey(d);}
function quarterStart(){const d=new Date();return todayKey(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1));}
function yearStart(){return todayKey(new Date(new Date().getFullYear(),0,1));}
function bucketBars(days,kind){
  if(kind==='week')return days.map((d,i)=>({label:T.wdShort[LI()][i],done:d.done,due:d.due}));
  const map={};
  days.forEach(d=>{const key=kind==='quarter'?weekKeyOf(d.k):d.k.slice(0,7);
    map[key]=map[key]||{done:0,due:0,k:d.k};map[key].done+=d.done;map[key].due+=d.due;});
  const keys=Object.keys(map).sort();
  return keys.map((key,i)=>({label:kind==='quarter'?(i%2?'':String(i+1)):T.mon[LI()][+key.slice(5,7)-1],
    done:map[key].done,due:map[key].due}));
}
async function viewReport(){
  const kind=period,to=todayKey();
  const from=kind==='week'?weekKeyOf(to):kind==='quarter'?quarterStart():yearStart();
  const r=rangeStats(from,to),bars=bucketBars(r.days,kind),mx=Math.max(1,...bars.map(b=>b.due||1));
  const hero=kind==='week'?t('heroWeek'):kind==='quarter'?t('heroQ'):t('heroY');
  const sum=kind==='week'?t('sumWeek'):kind==='quarter'?t('sumQ'):t('sumY');
  const txt=S.set.gentle?(LI()?`${r.dn} of ${r.tot} done. Ups and downs, that's normal.`:`完成了 ${r.dn}/${r.tot}。有起有落，很正常。`)
    :verdict(kind,r.rate,r.dn);
  const bestTxt=r.best&&r.best.done?(LI()?`Steadiest: ${r.best.t.title} (${r.best.done}/${r.best.due}). `:`最稳的是「${r.best.t.title}」，${r.best.done}/${r.best.due}。`):'';
  const worstTxt=r.worst&&r.worst!==r.best?(LI()?`Most skipped: ${r.worst.t.title} (${r.worst.done}/${r.worst.due}).`:`最爱鸽的是「${r.worst.t.title}」，${r.worst.due} 次里做了 ${r.worst.done} 次。`):'';
  const w=r.worst&&r.worst.t;
  const rx=kind==='week'
    ?(w?(LI()?`Next week, write it down as a rule: "when it hits ${w.time||'after dinner'}, I do ${w.title}". No "if I feel like it". The decision gets made once instead of every day.`
         :`下周就这么写死：「${w.time||'晚饭后'}一到，我就去做${w.title}」。别留"看情况"的余地。决策提前做完，你就不用每天再跟自己谈判一次。`)
       :(LI()?'Give every task a time and a place next week, not just a name.':'下周给每个任务都配上"什么时候、在哪儿做"，别只写要做什么。'))
    :kind==='quarter'
    ?(LI()?`Pick one thing for next quarter, not five. Your longest streak was ${r.streak} days — that's the ceiling you already proved you can hit. Aim to double it, not to add tasks.`
         :`下个季度只挑一件事，别铺五件。这三个月你最长连签 ${r.streak} 天，那是你已经证明过的上限。目标是把它翻倍，不是加任务。`)
    :(LI()?`One year of data says your ceiling is a ${r.streak}-day run. Habits that survive are the ones attached to something already fixed in your day. Bolt next year's onto an existing anchor instead of inventing a new slot.`
         :`一年的数据摆在这：你的上限是连续 ${r.streak} 天。活下来的习惯，都是挂在你本来就固定的事情上的。明年别再新开时段，挂到已有的锚点上。`);
  const b=brain(kind.length);
  let h=`<div class="hero"><div class="ghost">${Math.round(r.rate*100)}</div><h1>${hero}</h1>
    <div class="meta">${t('rangeMeta',from.slice(5),r.dn,r.tot)}</div></div>
  <div class="seg" id="pseg">
    <button data-p="week" class="${kind==='week'?'on':''}">${t('pWeek')}</button>
    <button data-p="quarter" class="${kind==='quarter'?'on':''}">${t('pQuarter')}</button>
    <button data-p="year" class="${kind==='year'?'on':''}">${t('pYear')}</button></div>
  <div class="card" style="margin-bottom:14px">
    <div class="bars">${bars.map(x=>{const hh=x.due?Math.max(6,x.done/mx*100):4;
      return `<div class="${x.due&&x.done===x.due?'hi':(x.done?'':'zero')}" style="height:${hh}%"></div>`;}).join('')}</div>
    <div class="blabel">${bars.map(x=>`<span>${x.label}</span>`).join('')}</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n">${Math.round(r.rate*100)}<small>%</small></div><div class="l">${t('statRate')}</div></div>
    <div class="stat"><div class="n">${r.dn}</div><div class="l">${t('statChecks')}</div></div>
    <div class="stat"><div class="n">${r.streak}</div><div class="l">${t('statBest')}</div></div>
  </div>
  <div class="roast ${S.set.gentle?'calm':''}"><span class="tag">${sum}</span><p>${esc(txt)}</p>
    ${(bestTxt+worstTxt)?`<div class="brain">${esc(bestTxt+worstTxt)}</div>`:''}</div>`;
  if(kind==='year'){
    const tt=YEARTITLE[LI()].find(([lim])=>r.rate>=lim||lim===0)[1];
    h+=`<div class="bigpoint" style="margin-bottom:16px"><div class="l" style="margin:0 0 10px">${t('title')}</div>
      <div style="font-size:38px;font-weight:800;letter-spacing:-.05em;color:var(--lime)">${esc(tt)}</div></div>`;
  }
  h+=`<div class="card" style="margin-bottom:14px"><div style="font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:8px">${kind==='week'?t('rxTitle'):kind==='quarter'?t('rxTitleQ'):t('rxTitleY')}</div>
    <div style="font-size:15px;line-height:1.7;font-weight:600">${esc(rx)}</div></div>
  <div class="card" style="margin-bottom:16px"><div style="font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:8px">${esc(b[0])}</div>
    <div style="font-size:14.5px;line-height:1.7">${esc(b[1])}</div></div>`;
  if(S.history.length)h+=`<div class="shead"><h2>${t('past')}</h2><span>${t('pastN',S.history.length)}</span></div>`+
    S.history.slice(-6).reverse().map(x=>`<div class="rank"><div class="i">${Math.round(x.rate*100)}%</div><div class="av">📄</div>
      <div class="nm">${t('weekOf',x.week.slice(5))}<em>${esc(String(x.txt).slice(0,30))}…</em></div></div>`).join('');
  h+=`<div class="shead"><h2>${t('wall')}</h2><span>${t('wallSub')}</span></div><div class="wall" id="wall"><div class="empty">${t('noPics')}</div></div>`;
  D('view').innerHTML=h;
  D('pseg').querySelectorAll('button').forEach(x=>x.onclick=()=>{period=x.dataset.p;viewReport();window.scrollTo(0,0);});
  const pics=[];
  for(const k of Object.keys(S.logs).sort().reverse())
    for(const id in S.logs[k])if(S.logs[k][id].img&&pics.length<12)pics.push([k,id]);
  if(pics.length){const W=D('wall');W.innerHTML='';
    for(const[k,id]of pics){const src=await sGet('dg_img_'+k+'_'+id);
      if(src)W.appendChild(el(`<div class="c"><img src="${src}"><div class="d">${k.slice(5)}</div></div>`));}
    if(!W.children.length)W.innerHTML=`<div class="empty">${t('noPics')}</div>`;}
}
function maybeArchiveWeek(){
  const lastMon=dayAdd(weekKeyOf(todayKey()),-7);
  if(S.lastWeek===lastMon)return;
  const r=rangeStats(lastMon,dayAdd(lastMon,6));
  if(r.tot>0){S.history.push({week:lastMon,rate:r.rate,txt:verdict('week',r.rate,r.dn)});
    setTimeout(()=>toast(t('tWeekly')),1400);
    maybeKingPigeon(r.rate);}
  S.lastWeek=lastMon;save();
}

/* ===================== 壳 ===================== */
function renderNav(){
  const names=T.nav[LI()],ic=['◎','▲','◆','▤'],ks=['today','board','reward','report'];
  D('nav').innerHTML=ks.map((k,i)=>`<button class="${tab===k?'on':''}" data-t="${k}"><i>${ic[i]}</i>${names[i]}</button>`).join('');
  D('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0);});
}
let _prevTab='today';
function render(){
  document.documentElement.lang=LI()?'en':'zh-CN';
  renderNav();
  if(tab!=='today') stopRoastTicker();
  if(tab==='today')viewToday();
  else if(tab==='board')viewBoard();
  else if(tab==='reward')viewReward();
  else if(tab==='settings')viewSettings();
  else viewReport();
  D('fab').style.display=tab==='today'?'grid':'none';
  D('settingsBtn').style.display=tab==='settings'?'none':'grid';
}
function sheet(html){const s=D('sheet');s.innerHTML='<div class="grab"></div>'+html;s.classList.add('on');D('scrim').classList.add('on');}
function closeSheet(){D('sheet').classList.remove('on');D('scrim').classList.remove('on');}
D('scrim').onclick=closeSheet;
D('fab').onclick=()=>openAdd(null);
D('settingsBtn').onclick=()=>{if(tab!=='settings'){_prevTab=tab;tab='settings';render();window.scrollTo(0,0);}};

(async function init(){
  const raw=await sGet(KEY);
  if(raw){try{const o=JSON.parse(raw);S=Object.assign(defaults(),o);S.set=Object.assign(defaults().set,o.set||{});S.streak=Object.assign({cur:0,best:0,noticed:null},o.streak||{});}catch(e){}}
  ensureDefaultTasks();
  recomputeStreak();maybeArchiveWeek();render();
  if(S.set.public)sSet('dglb:'+S.uid,JSON.stringify({name:S.set.name,pts:S.points,streak:S.streak.cur,avatar:S.set.avatar||'🫵',ts:Date.now()}),true);
})();
</script>
