<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#EFEFEA">
<title>鸽了吗</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="鸽了吗">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#EFEFEA; --card:#FFFFFF; --ink:#0E1013; --ink2:#3A3D44; --sub:#9A9CA1;
  --lime:#D6FF3F; --limeDeep:#B9E521; --dark:#101216; --soft:#E4E4DE; --line:#EDEDE8;
  --r:30px;
  --sh:0 22px 44px -26px rgba(14,16,19,.45), 0 3px 10px rgba(14,16,19,.05);
  --shHi:0 30px 60px -28px rgba(14,16,19,.55), 0 4px 14px rgba(14,16,19,.07);
}
html,body{margin:0;padding:0;background:#EFEFEA;color-scheme:light}
body{background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:26px 18px 150px;position:relative;overflow-x:hidden}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
::-webkit-scrollbar{width:0;height:0}
.hero{position:relative;padding:14px 6px 26px;margin-bottom:4px}
.ghost{position:absolute;right:-6px;top:-34px;font-size:150px;font-weight:800;letter-spacing:-.08em;line-height:1;color:#DFDFD8;user-select:none;pointer-events:none}
.hero h1{position:relative;font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:.98;margin:0}
.hero .meta{position:relative;margin-top:12px;font-size:13.5px;color:var(--sub);font-weight:500}
.hero .meta b{color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px 14px}
.stat .n{font-size:32px;font-weight:800;letter-spacing:-.05em;line-height:1}
.stat .n small{font-size:15px;font-weight:700;color:var(--sub);letter-spacing:0}
.stat .l{margin-top:8px;font-size:11px;color:var(--sub);font-weight:600;line-height:1.3}
.stat.on{background:var(--lime);box-shadow:var(--shHi)}
.stat.on .l{color:#4E5A16}
.roast{position:relative;background:var(--dark);color:#fff;border-radius:var(--r);padding:24px 22px;box-shadow:var(--shHi);margin-bottom:16px}
.roast .tag{display:inline-block;background:var(--lime);color:#12140F;font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px}
.roast p{margin:14px 0 0;font-size:20px;line-height:1.42;font-weight:700;letter-spacing:-.02em}
.roast .brain{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.13);font-size:12.5px;line-height:1.6;color:#B7BAC0}
.roast .brain b{color:var(--lime);font-weight:700}
.roast.calm{background:var(--card);color:var(--ink)}
.roast.calm .tag{background:var(--soft);color:var(--ink2)}
.roast.calm .brain{border-color:var(--line);color:var(--sub)}
.roast.calm .brain b{color:var(--ink)}
.shead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 6px 12px}
.shead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.03em}
.shead span{font-size:12.5px;color:var(--sub);font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.task{position:relative;background:var(--card);border-radius:26px;box-shadow:var(--sh);padding:18px;display:flex;gap:14px;align-items:center;transition:transform .16s ease}
.task:active{transform:scale(.985)}
.task .ico{width:46px;height:46px;flex:0 0 46px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.task .mid{flex:1;min-width:0}
.task .tt{font-size:16.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .ts{margin-top:5px;font-size:12px;color:var(--sub);font-weight:500}
.task .jab{margin-top:7px;font-size:12px;color:#C2410C;font-weight:600;line-height:1.4}
.check{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--soft);display:grid;place-items:center;transition:.18s}
.check svg{opacity:0;transform:scale(.5);transition:.18s}
.task.done{background:#F7F7F4;box-shadow:0 8px 20px -18px rgba(14,16,19,.4)}
.task.done .tt{color:var(--sub);text-decoration:line-through;text-decoration-thickness:2px}
.task.done .ico{background:#EFEFEA;filter:grayscale(1);opacity:.6}
.task.done .check{background:var(--lime);border-color:var(--lime)}
.task.done .check svg{opacity:1;transform:scale(1)}
.task.late{box-shadow:var(--shHi)}
.prog{height:5px;background:var(--soft);border-radius:4px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--limeDeep);border-radius:4px}
.empty{text-align:center;padding:44px 20px;color:var(--sub);font-size:14px;line-height:1.7}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(404px,calc(100% - 36px));
  background:var(--dark);border-radius:26px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  box-shadow:0 24px 44px -18px rgba(14,16,19,.6);z-index:60}
.nav button{padding:11px 4px;border-radius:20px;color:#8E9197;font-size:11px;font-weight:700;display:grid;gap:4px;justify-items:center;transition:.18s}
.nav button i{font-style:normal;font-size:17px;line-height:1}
.nav button.on{background:var(--lime);color:#12140F}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:59;width:58px;height:58px;border-radius:22px;
  background:var(--lime);color:#12140F;font-size:30px;display:grid;place-items:center;box-shadow:0 18px 34px -12px rgba(150,190,0,.85)}
.fab:active{transform:translateX(-50%) scale(.94)}
.scrim{position:fixed;inset:0;background:rgba(10,11,13,.42);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:.22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(102%);bottom:0;width:min(440px,100%);
  background:var(--bg);border-radius:34px 34px 0 0;z-index:81;padding:12px 18px calc(26px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grab{width:42px;height:5px;border-radius:4px;background:#D5D5CE;margin:6px auto 18px}
.sheet h3{margin:0 4px 16px;font-size:26px;font-weight:800;letter-spacing:-.04em}
.field{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:8px}
.field input,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:600}
.field textarea{resize:none;font-weight:500;font-size:15px;line-height:1.6;min-height:66px}
.field input::placeholder,.field textarea::placeholder{color:#C4C5C0;font-weight:500}
.row{display:flex;gap:10px}
.row .field{flex:1;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 2px 16px}
.chip{background:var(--card);border-radius:18px;padding:10px 14px;font-size:13.5px;font-weight:600;box-shadow:0 6px 16px -12px rgba(14,16,19,.5)}
.chip:active{background:var(--lime)}
.chip.on{background:var(--dark);color:#fff}
.btn{width:100%;padding:19px;border-radius:24px;background:var(--dark);color:#fff;font-size:16px;font-weight:700;box-shadow:var(--shHi)}
.btn.lime{background:var(--lime);color:#12140F}
.btn.ghost{background:transparent;color:var(--sub);box-shadow:none;font-weight:600;padding:14px}
.btn:active{transform:scale(.985)}
.mic{width:100%;padding:18px;border-radius:24px;background:var(--lime);color:#12140F;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 18px 34px -20px rgba(150,190,0,.9);margin-bottom:12px}
.mic.rec{background:var(--dark);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.62}}
.hint{font-size:12px;color:var(--sub);line-height:1.6;margin:0 6px 16px}
.stepper{display:flex;align-items:center;gap:16px}
.stepper button{width:44px;height:44px;border-radius:16px;background:var(--soft);font-size:22px;display:grid;place-items:center}
.stepper .v{font-size:38px;font-weight:800;letter-spacing:-.05em;min-width:70px;text-align:center}
.picwrap{position:relative;margin-bottom:12px}
.picwrap img{width:100%;border-radius:22px;display:block;box-shadow:var(--sh)}
.picwrap .rm{position:absolute;top:10px;right:10px;background:rgba(14,16,19,.72);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px}
.upload{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px;font-size:14.5px;font-weight:600}
.upload .p{width:34px;height:34px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:16px}
.seg{display:flex;gap:6px;background:var(--card);border-radius:22px;padding:6px;box-shadow:var(--sh);margin-bottom:16px}
.seg button{flex:1;padding:12px 6px;border-radius:17px;font-size:13.5px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--dark);color:#fff}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;margin-bottom:18px}
.pod{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px 10px;text-align:center}
.pod .av{font-size:26px}
.pod .nm{margin-top:8px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .pt{margin-top:4px;font-size:17px;font-weight:800;letter-spacing:-.03em}
.pod.first{background:var(--lime);box-shadow:var(--shHi);padding:24px 10px}
.pod.first .av{font-size:34px}
.rank{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:14px 18px;margin-bottom:10px}
.rank .i{font-size:15px;font-weight:800;color:var(--sub);width:26px;letter-spacing:-.03em}
.rank .av{font-size:22px}
.rank .nm{flex:1;font-size:14.5px;font-weight:700;min-width:0}
.rank .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--sub);font-weight:600;margin-top:3px}
.rank .pt{font-size:17px;font-weight:800;letter-spacing:-.03em}
.rank.me{background:var(--dark);color:#fff}
.rank.me .i,.rank.me .nm em{color:#8E9197}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--limeDeep);margin-right:5px;vertical-align:middle}
.bigpoint{background:var(--dark);color:#fff;border-radius:var(--r);padding:26px 24px;box-shadow:var(--shHi);margin-bottom:14px}
.bigpoint .n{font-size:64px;font-weight:800;letter-spacing:-.06em;line-height:1;color:var(--lime)}
.bigpoint .l{margin-top:10px;font-size:13px;color:#9DA0A6;font-weight:600}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:14px 6px;text-align:center;opacity:.32;filter:grayscale(1)}
.badge.got{opacity:1;filter:none}
.badge .e{font-size:24px}
.badge .t{margin-top:6px;font-size:10px;font-weight:700;line-height:1.3}
.rw{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:10px}
.rw .e{font-size:22px}
.rw .m{flex:1}
.rw .m b{font-size:15px;font-weight:700}
.rw .m em{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:3px;font-weight:600;line-height:1.45}
.rw .go{background:var(--lime);color:#12140F;font-size:13px;font-weight:800;padding:10px 15px;border-radius:16px;white-space:nowrap}
.rw .go.no{background:var(--soft);color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:5px;height:118px;margin:18px 0 8px}
.bars div{flex:1;background:var(--soft);border-radius:6px;min-height:5px}
.bars div.hi{background:var(--lime)}
.bars div.zero{background:#E9E9E3}
.blabel{display:flex;gap:5px}
.blabel span{flex:1;text-align:center;font-size:10px;color:var(--sub);font-weight:700;overflow:hidden}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wall .c{aspect-ratio:1;border-radius:18px;background:var(--soft);overflow:hidden;box-shadow:var(--sh);position:relative}
.wall .c img{width:100%;height:100%;object-fit:cover;display:block}
.wall .c .d{position:absolute;left:8px;bottom:7px;color:#fff;font-size:10.5px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-24px);top:22px;z-index:99;background:var(--dark);color:#fff;
  padding:14px 20px;border-radius:20px;font-size:14px;font-weight:600;box-shadow:var(--shHi);opacity:0;transition:.25s;max-width:88%;line-height:1.5;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pop{text-align:center;padding:8px 4px 4px}
.pop .e{font-size:64px}
.pop h4{margin:14px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.04em}
.pop p{margin:0 0 22px;font-size:14px;color:var(--sub);line-height:1.65}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:17px 18px;margin-bottom:10px}
.sw b{font-size:14.5px;font-weight:700}
.sw em{display:block;font-style:normal;font-size:11.5px;color:var(--sub);margin-top:4px;font-weight:500;line-height:1.5}
.tog{width:50px;height:30px;border-radius:16px;background:var(--soft);position:relative;flex:0 0 50px;transition:.2s}
.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.tog.on{background:var(--limeDeep)}
.tog.on i{left:23px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<nav class="nav" id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 基础工具（先声明，避免 TDZ） ===================== */
function pad(n){return String(n).padStart(2,'0');}
function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayAdd(k,n){const[y,m,d]=k.split('-').map(Number);return todayKey(new Date(y,m-1,d+n));}
function dateOf(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function dow(k){return dateOf(k).getDay();}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function t2m(t){if(!t)return null;const[a,b]=t.split(':').map(Number);return a*60+b;}
function seedRand(n){const x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x);}
function pick(a,seed){return a[Math.floor((seed==null?Math.random():seed)*a.length)%a.length];}
const D=id=>document.getElementById(id);
const esc=(s='')=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};

/* ===================== 文案：[中文, English] ===================== */
const T={
 appTitle:['鸽了吗','Flaked'],
 nav:[['今日','排行','奖励','战报'],['Today','Ranks','Rewards','Report']],
 heroToday:['今日<br>清单','Today'],
 heroBoard:['排行榜','Leader<br>board'],
 heroReward:['奖励','Rewards'],
 metaLeft:['{0} · {1} 月 · 还剩 <b>{2}</b> 项没交差','{0}, {1} · <b>{2}</b> still undone'],
 metaNone:['{0} · {1} 月 · 今天没有安排','{0}, {1} · nothing scheduled'],
 sDone:['今日完成','Done today'], sStreak:['连签天数','Day streak'], sPoints:['积分','Points'],
 tagEmpty:['空的','Empty'], tagClear:['全清','All clear'], tagLeft:['还剩 {0} 项','{0} left'],
 emptyRoast:['今天一条任务都没有。是真休息，还是不敢写。','Nothing on today. Real rest, or afraid to write it down?'],
 tasks:['任务','Tasks'], tapToCheck:['点一下打卡','Tap to check in'],
 emptyList:['今天列表是空的。<br>点右下角的 + 加一个，说话也行。','Nothing here today.<br>Hit + below. You can just talk to it.'],

 /* 打卡面板 */
 ckCount:['今天完成了多少 {0}（目标 {1}）','How much {0} today? (goal {1})'],
 ckFull:['直接满额','Max it'],
 ckNote:['写点什么（可选）','Say something (optional)'],
 ckNotePh:['今天做得怎么样？三个字也行。','How did it go? Three words is fine.'],
 ckPhoto:['加一张照片，存进你的记忆墙','Add a photo for your wall'],
 ckDone:['完成打卡','Check in'], ckUpdate:['更新记录','Update'],
 ckUndo:['撤销今天的打卡','Undo today'], ckEdit:['编辑任务','Edit task'],
 youWrote:['你写下的','What you wrote'], takeIt:['收下','Take it'],
 /* 添加任务 */
 newTask:['新任务','New task'], editTask:['编辑任务','Edit task'],
 micIdle:['按住说：每天早上七点跑步30分钟','Tap and say: run 30 minutes at 7pm daily'],
 micListen:['在听… 说完自动停','Listening… stops on its own'],
 micNo:['这个浏览器不支持语音，直接打字吧','No speech support here. Just type.'],
 micRetry:['再说一次','Say it again'], micHeard:['听到：{0}','Heard: {0}'],
 fWhat:['要做什么','What are you doing'],
 fWhatPh:['例：每天晚上10点阅读20页','e.g. read 20 pages at 10pm daily'],
 fTime:['提醒时间','Time'], fGoal:['目标数量（可空）','Goal (optional)'], fGoalPh:['如 30','e.g. 30'],
 fUnit:['单位','Unit'], fUnitPh:['分钟 / 页 / 杯','min / pages / cups'],
 fRepeat:['重复','Repeat'], fSave:['保存','Save'], fAdd:['加入清单','Add it'], fDel:['删除这个任务','Delete this task'],
 /* 排行榜 */
 boardSub:['跟你一起没睡懒觉的人','People who also got out of bed'],
 yourSpot:['你的位置','Your spot'],
 fullList:['完整榜单','Full list'], people:['{0} 人','{0} people'],
 streakN:['连签 {0} 天','{0}-day streak'], realTag:['真人','real person'], botTag:['虚拟','bot'],
 goPublic:['公开我的分数','Go public'],
 pubTitle:['加入公共榜单','Join the public board'],
 pubDesc:['开启后，你的昵称、积分和连签天数会被其他使用者看到，切到本页时刷新一次。关掉即停止上传。','Your nickname, points and streak become visible to other users. Refreshed when you open this tab. Turn it off to stop uploading.'],
 nickname:['榜上显示的昵称','Name shown on the board'],
 botNote:['带「虚拟」的是本地生成的对手，不联网。','Entries marked bot are generated locally and never go online.'],
 onBoard:['已上榜','You are on the board'], offBoard:['已退出公共榜','Removed from the public board'],
 /* 奖励 */
 lvLabel:['当前段位 <b>{0}</b> · 免鸽卡 <b>{1}</b> 张','Rank <b>{0}</b> · <b>{1}</b> skip pass'],
 ptsAvail:['可用积分 · 累计打卡 {0} 次','Points available · {0} check-ins total'],

 boxOpen:['开箱','Open'], boxAgain:['再来一次（60 分）','Again (60 pts)'], boxStop:['见好就收','Walk away'],
 myRewards:['兑换你自己的奖励','Your own rewards'], redeem:['兑换','Redeem'],

/* ===================== 解析 ===================== */
function iconFor(s){
  const m=[[/跑|走路|步|run|walk/i,'🏃'],[/水|喝|water|drink/i,'💧'],[/书|阅读|读|read|book/i,'📖'],
  [/睡|床|sleep|bed/i,'😴'],[/健身|俯卧|撸铁|练|gym|workout|lift/i,'💪'],[/单词|英语|背|vocab|word/i,'🔤'],
  [/冥想|正念|呼吸|medit|breath/i,'🧘'],[/写|日记|笔记|journal|write|note/i,'✍️'],[/学|课|复习|study|class/i,'📚'],
  [/药|维生素|pill|vitamin|med/i,'💊'],[/早起|起床|wake|rise/i,'🌅'],[/代码|编程|刷题|code|leetcode/i,'💻'],
  [/琴|吉他|guitar|piano/i,'🎸'],[/画|draw|paint/i,'🎨'],[/戒|少吃|忌|quit|no /i,'🚫'],[/打扫|整理|clean|tidy/i,'🧹']];
  for(const[r,e]of m)if(r.test(s))return e;return '🎯';
}
function parseTask(raw){
  let s=' '+raw.trim()+' ',days=[0,1,2,3,4,5,6],time=null,target=0,unit='',cut=[];
  const rx=x=>new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  if(/工作日|上班日|周一到周五|weekday|mon-fri/i.test(s)){days=[1,2,3,4,5];cut.push(/工作日|上班日|周一到周五|weekdays?|mon-fri/gi);}
  else if(/周末|双休|weekend/i.test(s)){days=[0,6];cut.push(/周末|双休|weekends?/gi);}
  else{
    const wk=s.match(/周[一二三四五六日天]/g);
    if(wk){const mp={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
      days=[...new Set(wk.map(w=>mp[w[1]]))];cut.push(/每?周[一二三四五六日天]、?/g);}
  }
  let off=0;
  if(/下午|傍晚|晚上|夜里|睡前|今晚|\bpm\b|evening|night|tonight/i.test(s))off=12;
  const ap=s.match(/(\d{1,2})\s*(?::|：|点)\s*(\d{1,2})?/)||s.match(/\b(\d{1,2})\s*(am|pm)\b/i);
  if(ap){let h=+ap[1];const mi=+(ap[2]&&!isNaN(ap[2])?ap[2]:0);
    if(/pm/i.test(ap[2]||'')&&h<12)h+=12; else if(/am/i.test(ap[2]||'')&&h===12)h=0;
    else if(off&&h<12)h+=12;
    time=pad(Math.min(h,23))+':'+pad(Math.min(mi,59));cut.push(rx(ap[0]));}
  const du=s.match(/(\d+)\s*(分钟|小时|个小时|min(?:ute)?s?|hours?|hrs?|h\b)/i);
  if(du){target=+du[1]*(/小时|hour|hr|^h$/i.test(du[2])?60:1);unit=LI()?'min':'分钟';cut.push(rx(du[0]));}
  else{const cn=s.match(/(\d+)\s*(杯|次|页|个|篇|道|组|公里|千米|km|下|cups?|pages?|reps?|times?|words?|km)/i);
    if(cn){target=+cn[1];unit=cn[2];cut.push(rx(cn[0]));}}
  let title=s;cut.forEach(r=>title=title.replace(r,' '));
  title=title.replace(/每天|每日|天天|早上|上午|中午|下午|晚上|夜里|睡前|提醒我?|记得|我要|要去?|打卡|一下|之前|前|半/g,' ')
    .replace(/\b(every ?day|daily|each day|remind me( to)?|i want to|i will|go|at|in the|morning|afternoon|evening|night|tonight|am|pm)\b/gi,' ')
    .replace(/\s+/g,LI()?' ':'').trim();
  if(!title)title=raw.trim().slice(0,14)||(LI()?'New task':'新任务');
  return {title,days,time,target,unit:target?unit:'',type:target?'count':'bool',icon:iconFor(title)};
}

/* ===================== 计算 ===================== */
function dueTasks(k){k=k||todayKey();const d=dow(k);return S.tasks.filter(x=>!x.arch&&x.days.includes(d)&&x.start<=k);}
function log(k,id){return (S.logs[k]||{})[id]||null;}
function isDone(k,x){const l=log(k,x.id);if(!l)return false;return x.type==='count'?(l.count||0)>=x.target:!!l.done;}
function dayRate(k){const d=dueTasks(k);if(!d.length)return null;return d.filter(x=>isDone(k,x)).length/d.length;}
function totalDone(s){let n=0;for(const k in s.logs)for(const i in s.logs[k]){const l=s.logs[k][i];if(l.done||l.count)n++;}return n;}
function countPics(s){let n=0;for(const k in s.logs)for(const i in s.logs[k])if(s.logs[k][i].img)n++;return n;}
function recomputeStreak(){
  const prev=S.streak.cur||0;let k=todayKey(),cur=0;
  if(dayRate(k)===1)cur=1;
  k=dayAdd(k,-1);
  for(let i=0;i<500;i++){const r=dayRate(k);if(r===null){k=dayAdd(k,-1);continue;}if(r===1)cur++;else break;k=dayAdd(k,-1);}
  S.streak.cur=cur;S.streak.best=Math.max(S.streak.best,cur);
  if(prev>=3&&cur===0&&S.streak.noticed!==todayKey()){S.streak.noticed=todayKey();
    setTimeout(()=>toast(S.set.gentle?t('tStreakG',prev):pk('brk').split('{n}').join(prev)),1500);}
}
function checkBadges(){
  const got=[];BADGES.forEach(b=>{if(!S.badges.includes(b.id)&&b.c(S)){S.badges.push(b.id);got.push(b.e+' '+b.n[LI()]);}});
  if(got.length)setTimeout(()=>toast(t('tBadge',got.join(', '))),700);
}
function rangeStats(from,to){
  let tot=0,dn=0,det={},days=[],run=0,best=0;
  if(from<S.created)from=S.created;
  for(let k=from;k<=to;k=dayAdd(k,1)){
    const due=dueTasks(k),d=due.filter(x=>isDone(k,x)).length;
    tot+=due.length;dn+=d;days.push({k,due:due.length,done:d});
    if(due.length&&d===due.length){run++;best=Math.max(best,run);}else if(due.length)run=0;
    due.forEach(x=>{det[x.id]=det[x.id]||{t:x,due:0,done:0};det[x.id].due++;if(isDone(k,x))det[x.id].done++;});
  }
  const arr=Object.values(det).filter(x=>x.due>=2).sort((a,b)=>(b.done/b.due)-(a.done/a.due));
  return {tot,dn,rate:tot?dn/tot:0,days,best:arr[0],worst:arr[arr.length-1],streak:best};
}
function verdict(kind,rate,checks){
  const tiers=VERDICT[kind][LI()];
  const hit=tiers.find(([lim])=>rate>=lim||lim===0);
  const cands=tiers.filter(([lim])=>lim===hit[0]);
  const txt=pick(cands)[1];
  return txt.split('{P}').join(Math.round(rate*100)).split('{N}').join(checks);
}

/* ===================== 今日 ===================== */
function roastNow(){
  const k=todayKey(),due=dueTasks(k),pend=due.filter(x=>!isDone(k,x));
  if(!due.length)return{tag:t('tagEmpty'),txt:t('emptyRoast'),b:brain(),calm:true};
  if(!pend.length)return{tag:t('tagClear'),txt:S.set.gentle?(LI()?'Everything done today. Noted.':'今天全部完成了，给自己记一笔。'):pk('praise'),b:brain(),calm:true};
  if(S.set.gentle)return{tag:t('tagLeft',pend.length),txt:pk('gentle'),b:brain(),calm:true};
  const late=pend.map(x=>({x,over:x.time?nowMin()-t2m(x.time):-1})).filter(o=>o.over>0).sort((a,b)=>b.over-a.over)[0];
  if(late&&late.over>10){
    const h=Math.floor(late.over/60),m=late.over%60;
    const dur=LI()?((h?h+'h ':'')+(m?m+'m':'')).trim():((h?h+'小时':'')+(m?m+'分钟':''));
    return{tag:late.x.title,txt:pk('late').split('{m}').join(dur),b:brain()};
  }
  return{tag:t('tagLeft',pend.length),txt:pk('spicy'),b:brain()};
}
function taskJab(x){
  if(S.set.gentle||!x.time)return '';
  const over=nowMin()-t2m(x.time);if(over<=15)return '';
  const h=Math.floor(over/60),m=over%60,s=(h?h+'h':'')+(m?m+'m':'');
  return pk('jab',seedRand(x.id.length*7+new Date().getHours())).split('{s}').join(s);
}

  const k=todayKey(),d=new Date(),due=dueTasks(k),done=due.filter(x=>isDone(k,x)).length,r=roastNow();
  const wd=T.wd[LI()][d.getDay()];

    <div class="meta">${due.length?t('metaLeft',wd,moTxt,due.length-done):t('metaNone',wd,moTxt)}</div></div>

    <div class="stat ${done&&done===due.length?'on':''}"><div class="n">${done}<small>/${due.length}</small></div><div class="l">${t('sDone')}</div></div>
    <div class="stat"><div class="n">${S.streak.cur}</div><div class="l">${t('sStreak')}</div></div>
    <div class="stat"><div class="n">${S.points}</div><div class="l">${t('sPoints')}</div></div>
  </div>
  <div class="roast ${r.calm?'calm':''}"><span class="tag">${esc(r.tag)}</span><p>${esc(r.txt)}</p>
    <div class="brain"><b>${esc(r.b[0])}</b> · ${esc(r.b[1])}</div></div>
  <div class="shead"><h2>${t('tasks')}</h2><span>${t('tapToCheck')}</span></div><div class="list" id="list"></div>`;
  D('view').innerHTML=h;
  const L=D('list');
  if(!due.length){L.innerHTML=`<div class="empty">${t('emptyList')}</div>`;return;}
  due.sort((a,b)=>(isDone(k,a)-isDone(k,b))||((t2m(a.time)==null?1e4:t2m(a.time))-(t2m(b.time)==null?1e4:t2m(b.time))));
  due.forEach(x=>{
    const l=log(k,x.id),dn=isDone(k,x),jab=dn?'':taskJab(x);
    const sub=[x.time||t('anytime'),x.type==='count'?`${(l&&l.count)||0}/${x.target} ${x.unit||''}`:'',l&&l.note?'📝':''].filter(Boolean).join(' · ');
    const n=el(`<div class="task ${dn?'done':''} ${jab?'late':''}">
      <div class="ico">${x.icon}</div>
      <div class="mid"><div class="tt">${esc(x.title)}</div><div class="ts">${esc(sub)}</div>
      ${x.type==='count'?`<div class="prog"><i style="width:${Math.min(100,((l&&l.count)||0)/x.target*100)}%"></i></div>`:''}
      ${jab?`<div class="jab">${esc(jab)}</div>`:''}</div>
      <div class="check"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l4 4 8-9" stroke="#12140F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`);
    n.onclick=()=>openCheckin(x);L.appendChild(n);
  });
  const rb=document.querySelector('.roast');
  if(rb) rb.onclick=refreshRoast;
  startRoastTicker();
}
let _roastTimer=null;
function refreshRoast(){
  const rb=document.querySelector('.roast'); if(!rb) return;
  const r=roastNow();
  rb.className='roast '+(r.calm?'calm':'');
  rb.innerHTML=`<span class="tag">${esc(r.tag)}</span><p>${esc(r.txt)}</p>
    <div class="brain"><b>${esc(r.b[0])}</b> · ${esc(r.b[1])}</div>`;
  rb.onclick=refreshRoast;
}
function startRoastTicker(){
  stopRoastTicker();
  _roastTimer=setInterval(()=>{
    if(tab!=='today') return stopRoastTicker();
    if(D('sheet').classList.contains('on')) return;
    refreshRoast();
  }, 45000);
}
function stopRoastTicker(){ if(_roastTimer){clearInterval(_roastTimer);_roastTimer=null;} }

/* ===================== 打卡 ===================== */
const stepOf=x=>x.target>=30?5:1;
function shrink(file,max=780,q=.62){return new Promise(res=>{const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height));
    const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};i.src=r.result;};
  r.readAsDataURL(file);});}

  sheet(`<h3>${x.icon} ${esc(x.title)}</h3>
  ${x.type==='count'?`<div class="field"><label>${t('ckCount',esc(x.unit||''),x.target)}</label>
    <div class="stepper"><button id="mi">−</button><div class="v" id="cv">${l.count||0}</div><button id="pl">+</button>
    <button class="chip" id="full" style="margin-left:auto">${t('ckFull')}</button></div></div>`:''}
  <div class="field"><label>${t('ckNote')}</label><textarea id="note" placeholder="${t('ckNotePh')}">${esc(l.note||'')}</textarea></div>
  <div id="picbox">${img?`<div class="picwrap"><img src="${img}"><button class="rm" id="rmpic">×</button></div>`:up}</div>
  <button class="btn lime" id="ok">${dn?t('ckUpdate'):t('ckDone')}</button>
  ${dn?`<button class="btn ghost" id="undo">${t('ckUndo')}</button>`:''}
  <button class="btn ghost" id="edit">${t('ckEdit')}</button>`);

  const upd=()=>{const e=H.querySelector('#cv');if(e)e.textContent=cv;};
  H.querySelector('#mi')&&(H.querySelector('#mi').onclick=()=>{cv=Math.max(0,cv-stepOf(x));upd();});
  H.querySelector('#pl')&&(H.querySelector('#pl').onclick=()=>{cv+=stepOf(x);upd();});
  H.querySelector('#full')&&(H.querySelector('#full').onclick=()=>{cv=x.target;upd();});
  const bindF=()=>{const f=H.querySelector('#file');if(!f)return;
    f.onchange=async e=>{const file=e.target.files[0];if(!file)return;toast(t('tShrink'));img=await shrink(file);

  const bindR=()=>{const r=H.querySelector('#rmpic');if(r)r.onclick=()=>{img=null;H.querySelector('#picbox').innerHTML=up;bindF();};};
  bindF();bindR();
  H.querySelector('#ok').onclick=async()=>{
    const note=H.querySelector('#note').value.trim(),was=dn;
    S.logs[k]=S.logs[k]||{};
    S.logs[k][x.id]={done:x.type==='count'?cv>=x.target:true,count:x.type==='count'?cv:1,note,img:!!img,ts:Date.now()};
    if(img)await sSet('dg_img_'+k+'_'+x.id,img);
    let earned=0;
    if(!was&&isDone(k,x)){earned=10+Math.min(15,S.streak.cur);S.points+=earned;
      if(dueTasks(k).every(y=>isDone(k,y))){S.points+=30;earned+=30;}}
    recomputeStreak();checkBadges();save();closeSheet();
    if(earned)setTimeout(()=>reward(x,earned,note,img),260);else{render();toast(t('tUpdated'));}

/* ===================== 排行榜 ===================== */
function botScores(){
  const days=Math.max(1,Math.round((Date.now()-dateOf(S.created).getTime())/864e5)+1);
  return BOTS.map((b,i)=>({name:b.n[LI()],av:b.a,bot:true,
    pts:Math.round(b.r*days*(0.85+seedRand(i+days)*0.32)),streak:Math.min(days,Math.round(days*(b.r/90)))}));
}
async function viewBoard(){
  D('view').innerHTML=`<div class="hero"><div class="ghost">${S.points}</div><h1>${t('heroBoard')}</h1>
    <div class="meta">${t('boardSub')}</div></div><div id="lb"><div class="empty">…</div></div>`;
  let rows=botScores();
  rows.push({name:S.set.name||(LI()?'You':'我'),av:'🫵',pts:S.points,me:true,streak:S.streak.cur});
  if(S.set.public){try{
    const r=await window.storage.list('dglb:',true);
    for(const k of (r&&r.keys||[]).filter(x=>x!=='dglb:'+S.uid).slice(0,18)){
      const g=await sGet(k,true);if(!g)continue;const o=JSON.parse(g);
      if(o&&o.name)rows.push({name:o.name,av:'🙂',pts:o.pts|0,streak:o.streak|0,real:true});}
  }catch(e){}}
  rows.sort((a,b)=>b.pts-a.pts);
  const my=rows.findIndex(r=>r.me)+1,top=rows.slice(0,3),rest=rows.slice(3);
  const taunt=S.set.gentle?(LI()?`You're #${my}. Compare with yourself, that's enough.`:`你排在第 ${my} 名，和自己比就够了。`)
    :(my<=3?(LI()?'Top three. Screenshot it, might not happen twice.':'前三。截个图吧，可能不会有第二次。')
    :my<=rows.length/2?(LI()?`#${my}. Mid-table — the easiest place to hide.`:`第 ${my} 名。不上不下，最容易混过去的位置。`)
    :(LI()?`#${my}, ${rows.length-my+1} from the bottom. Everyone above you also gets 24 hours.`:`第 ${my} 名，倒数第 ${rows.length-my+1}。上面那些人也是一天二十四小时。`));
  const b=brain(8);
  let h=`<div class="podium">${[1,0,2].map(i=>{const x=top[i];if(!x)return '<div></div>';
    return `<div class="pod ${i===0?'first':''}"><div class="av">${x.av}</div><div class="nm">${esc(x.name)}</div><div class="pt">${x.pts}</div></div>`;}).join('')}</div>
  <div class="roast ${S.set.gentle?'calm':''}" style="margin-bottom:18px"><span class="tag">${t('yourSpot')}</span><p>${esc(taunt)}</p>
    <div class="brain"><b>${esc(b[0])}</b> · ${esc(b[1])}</div></div>
  <div class="shead"><h2>${t('fullList')}</h2><span>${t('people',rows.length)}</span></div>
  ${rest.map((r,i)=>`<div class="rank ${r.me?'me':''}"><div class="i">${i+4}</div><div class="av">${r.av}</div>
    <div class="nm">${esc(r.name)}<em>${t('streakN',r.streak)} · ${r.me?'':(r.real?'<span class="dot"></span>'+t('realTag'):t('botTag'))}</em></div>
    <div class="pt">${r.pts}</div></div>`).join('')}
  <p class="hint" style="margin-top:14px">${t('botNote')}</p>
  <div class="shead"><h2>${t('goPublic')}</h2></div>
  <div class="sw"><div><b>${t('pubTitle')}</b><em>${t('pubDesc')}</em></div><div class="tog ${S.set.public?'on':''}" id="pub"><i></i></div></div>
  <div class="field"><label>${t('nickname')}</label><input id="nm" value="${esc(S.set.name||'')}" placeholder="${LI()?'You':'我'}"></div>`;
  D('lb').innerHTML=h;
  D('pub').onclick=async()=>{S.set.public=!S.set.public;
    if(S.set.public){S.set.name=D('nm').value.trim()||(LI()?'Anonymous':'匿名选手');
      await sSet('dglb:'+S.uid,JSON.stringify({name:S.set.name,pts:S.points,streak:S.streak.cur,ts:Date.now()}),true);toast(t('onBoard'));}
    else{try{await window.storage.delete('dglb:'+S.uid,true)}catch(e){}toast(t('offBoard'));}
    save();render();};
  D('nm').onchange=ev=>{S.set.name=ev.target.value.trim();save();};
}

function ensureDefaultTasks(){
  const now=LI()?'en':'zh';
  const zh=[
    {id:'t1',title:'喝水',icon:'💧',type:'count',target:8,unit:'杯',time:'09:00',days:[0,1,2,3,4,5,6],start:todayKey(),_d:1},
    {id:'t2',title:'阅读',icon:'📖',type:'count',target:20,unit:'页',time:'21:00',days:[0,1,2,3,4,5,6],start:todayKey(),_d:1},
    {id:'t3',title:'运动',icon:'🏃',type:'count',target:30,unit:'分钟',time:'19:00',days:[1,2,3,4,5],start:todayKey(),_d:1}
  ];
  const en=[
    {id:'t1',title:'Water',icon:'💧',type:'count',target:8,unit:'cups',time:'09:00',days:[0,1,2,3,4,5,6],start:todayKey(),_d:1},
    {id:'t2',title:'Read',icon:'📖',type:'count',target:20,unit:'pages',time:'21:00',days:[0,1,2,3,4,5,6],start:todayKey(),_d:1},
    {id:'t3',title:'Move',icon:'🏃',type:'count',target:30,unit:'min',time:'19:00',days:[1,2,3,4,5],start:todayKey(),_d:1}
  ];
  const noLogs=Object.keys(S.logs||{}).length===0;

  // 首次进入或原装未动过 → 用当前语言重建
  if(!S.tasks.length || (allDefault && noLogs && S.tasksLang!==now)){
    S.tasks = (now==='en'?en:zh);

    save();
  }
}
function ensureDefaultRewards(){
  const now=LI()?'en':'zh';
  const zh=[{e:'🧋',t:'一杯奶茶',c:300,_d:1},{e:'🎮',t:'放肆玩两小时',c:500,_d:1},{e:'🛌',t:'心安理得睡懒觉',c:800,_d:1}];
  const en=[{e:'🧋',t:'One bubble tea',c:300,_d:1},{e:'🎮',t:'Two hours of games, guilt-free',c:500,_d:1},{e:'🛌',t:'Sleep in without shame',c:800,_d:1}];

    S.rewards = (now==='en'?en:zh);
    S.rewardsLang = now;

}
/* ===================== 导入 / 导出 ===================== */
async function exportData(){
  const images={};
  try{
    const r=await window.storage.list('dg_img_',false);
    for(const k of (r&&r.keys)||[]){
      const v=await sGet(k);
      if(v) images[k]=v;
    }
  }catch(e){}
  const pack={version:'dg-v4',exportedAt:new Date().toISOString(),state:S,images};
  const blob=new Blob([JSON.stringify(pack)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`flaked-backup-${todayKey()}.json`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},200);
  toast(LI()?'Backup downloaded.':'备份已下载。');
}
function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async ev=>{
    const f=ev.target.files[0]; if(!f) return;
    let pack;
    try{ pack=JSON.parse(await f.text()); }
    catch(e){ return toast(LI()?'Not a valid JSON.':'不是有效的 JSON。'); }
    if(!pack||!pack.state||!pack.version||pack.version.indexOf('dg-')!==0)
      return toast(LI()?'Not a valid backup.':'不是有效的备份。');
    const when=(pack.exportedAt||'').slice(0,10);
    const nTasks=(pack.state.tasks||[]).length;
    const nLogs=Object.keys(pack.state.logs||{}).length;
    sheet(`<h3>${LI()?'Import backup':'导入备份'}</h3>
      <div class="field"><label>${LI()?'Backup info':'备份信息'}</label>
        <div style="font-size:15px;line-height:1.7;font-weight:600">
          ${LI()?'Exported':'导出时间'}: ${esc(when)}<br>
          ${LI()?'Tasks':'任务数'}: ${nTasks}<br>
          ${LI()?'Days logged':'打卡天数'}: ${nLogs}<br>
          ${LI()?'Points':'积分'}: ${pack.state.points|0}
        </div></div>
      <p class="hint">${LI()?'This will replace ALL current data. Cannot be undone.':'这会覆盖当前所有数据，无法撤销。'}</p>
      <button class="btn lime" id="okimp">${LI()?'Import and replace':'导入并覆盖'}</button>
      <button class="btn ghost" id="cnimp">${LI()?'Cancel':'取消'}</button>`);
    D('sheet').querySelector('#cnimp').onclick=closeSheet;
    D('sheet').querySelector('#okimp').onclick=async()=>{
      S=Object.assign(defaults(),pack.state);
      S.set=Object.assign(defaults().set,pack.state.set||{});
      S.streak=Object.assign({cur:0,best:0,noticed:null},pack.state.streak||{});
      await sSet(KEY,JSON.stringify(S));
      const imgs=pack.images||{};
      for(const k in imgs){ try{ await sSet(k,imgs[k]); }catch(e){} }
      recomputeStreak(); closeSheet(); render();
      toast(LI()?'Imported. Welcome back.':'导入完成，欢迎回来。');
    };
  };
  inp.click();
}

/* ===================== 战报：周 / 季 / 年 ===================== */
function weekKeyOf(k){const d=dateOf(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return todayKey(d);}
function quarterStart(){const d=new Date();return todayKey(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1));}
function yearStart(){return todayKey(new Date(new Date().getFullYear(),0,1));}
function bucketBars(days,kind){
  if(kind==='week')return days.map((d,i)=>({label:T.wdShort[LI()][i],done:d.done,due:d.due}));
  const map={};
  days.forEach(d=>{const key=kind==='quarter'?weekKeyOf(d.k):d.k.slice(0,7);
    map[key]=map[key]||{done:0,due:0,k:d.k};map[key].done+=d.done;map[key].due+=d.due;});
  const keys=Object.keys(map).sort();
  return keys.map((key,i)=>({label:kind==='quarter'?(i%2?'':String(i+1)):T.mon[LI()][+key.slice(5,7)-1],
    done:map[key].done,due:map[key].due}));
}
async function viewReport(){
  const kind=period,to=todayKey();
  const from=kind==='week'?weekKeyOf(to):kind==='quarter'?quarterStart():yearStart();
  const r=rangeStats(from,to),bars=bucketBars(r.days,kind),mx=Math.max(1,...bars.map(b=>b.due||1));
  const hero=kind==='week'?t('heroWeek'):kind==='quarter'?t('heroQ'):t('heroY');
  const sum=kind==='week'?t('sumWeek'):kind==='quarter'?t('sumQ'):t('sumY');
  const txt=S.set.gentle?(LI()?`${r.dn} of ${r.tot} done. Ups and downs, that's normal.`:`完成了 ${r.dn}/${r.tot}。有起有落，很正常。`)
    :verdict(kind,r.rate,r.dn);
  const bestTxt=r.best&&r.best.done?(LI()?`Steadiest: ${r.best.t.title} (${r.best.done}/${r.best.due}). `:`最稳的是「${r.best.t.title}」，${r.best.done}/${r.best.due}。`):'';
  const worstTxt=r.worst&&r.worst!==r.best?(LI()?`Most skipped: ${r.worst.t.title} (${r.worst.done}/${r.worst.due}).`:`最爱鸽的是「${r.worst.t.title}」，${r.worst.due} 次里做了 ${r.worst.done} 次。`):'';
  const w=r.worst&&r.worst.t;
  const rx=kind==='week'
    ?(w?(LI()?`Next week, write it down as a rule: "when it hits ${w.time||'after dinner'}, I do ${w.title}". No "if I feel like it". The decision gets made once instead of every day.`
         :`下周就这么写死：「${w.time||'晚饭后'}一到，我就去做${w.title}」。别留"看情况"的余地。决策提前做完，你就不用每天再跟自己谈判一次。`)

    ?(LI()?`Pick one thing for next quarter, not five. Your longest streak was ${r.streak} days — that's the ceiling you already proved you can hit. Aim to double it, not to add tasks.`
         :`下个季度只挑一件事，别铺五件。这三个月你最长连签 ${r.streak} 天，那是你已经证明过的上限。目标是把它翻倍，不是加任务。`)
    :(LI()?`One year of data says your ceiling is a ${r.streak}-day run. Habits that survive are the ones attached to something already fixed in your day. Bolt next year's onto an existing anchor instead of inventing a new slot.`
         :`一年的数据摆在这：你的上限是连续 ${r.streak} 天。活下来的习惯，都是挂在你本来就固定的事情上的。明年别再新开时段，挂到已有的锚点上。`);

    <button data-p="week" class="${kind==='week'?'on':''}">${t('pWeek')}</button>
    <button data-p="quarter" class="${kind==='quarter'?'on':''}">${t('pQuarter')}</button>
    <button data-p="year" class="${kind==='year'?'on':''}">${t('pYear')}</button></div>
  <div class="card" style="margin-bottom:14px">
    <div class="bars">${bars.map(x=>{const hh=x.due?Math.max(6,x.done/mx*100):4;
      return `<div class="${x.due&&x.done===x.due?'hi':(x.done?'':'zero')}" style="height:${hh}%"></div>`;}).join('')}</div>
    <div class="blabel">${bars.map(x=>`<span>${x.label}</span>`).join('')}</div>

  <div class="roast ${S.set.gentle?'calm':''}"><span class="tag">${sum}</span><p>${esc(txt)}</p>
    ${(bestTxt+worstTxt)?`<div class="brain">${esc(bestTxt+worstTxt)}</div>`:''}</div>`;
  if(kind==='year'){

    h+=`<div class="bigpoint" style="margin-bottom:16px"><div class="l" style="margin:0 0 10px">${t('title')}</div>

  if(S.history.length)h+=`<div class="shead"><h2>${t('past')}</h2><span>${t('pastN',S.history.length)}</span></div>`+
    S.history.slice(-6).reverse().map(x=>`<div class="rank"><div class="i">${Math.round(x.rate*100)}%</div><div class="av">📄</div>
      <div class="nm">${t('weekOf',x.week.slice(5))}<em>${esc(String(x.txt).slice(0,30))}…</em></div></div>`).join('');
  h+=`<div class="shead"><h2>${t('wall')}</h2><span>${t('wallSub')}</span></div><div class="wall" id="wall"><div class="empty">${t('noPics')}</div></div>`;
  D('view').innerHTML=h;
  D('pseg').querySelectorAll('button').forEach(x=>x.onclick=()=>{period=x.dataset.p;viewReport();window.scrollTo(0,0);});
  const pics=[];
  for(const k of Object.keys(S.logs).sort().reverse())
    for(const id in S.logs[k])if(S.logs[k][id].img&&pics.length<12)pics.push([k,id]);
  if(pics.length){const W=D('wall');W.innerHTML='';
    for(const[k,id]of pics){const src=await sGet('dg_img_'+k+'_'+id);
      if(src)W.appendChild(el(`<div class="c"><img src="${src}"><div class="d">${k.slice(5)}</div></div>`));}
    if(!W.children.length)W.innerHTML=`<div class="empty">${t('noPics')}</div>`;}
}
function maybeArchiveWeek(){
  const lastMon=dayAdd(weekKeyOf(todayKey()),-7);
  if(S.lastWeek===lastMon)return;
  const r=rangeStats(lastMon,dayAdd(lastMon,6));
  if(r.tot>0){S.history.push({week:lastMon,rate:r.rate,txt:verdict('week',r.rate,r.dn)});
    setTimeout(()=>toast(t('tWeekly')),1400);}
  S.lastWeek=lastMon;save();
}

/* ===================== 壳 ===================== */
function renderNav(){
  const names=T.nav[LI()],ic=['◎','▲','◆','▤'],ks=['today','board','reward','report'];
  D('nav').innerHTML=ks.map((k,i)=>`<button class="${tab===k?'on':''}" data-t="${k}"><i>${ic[i]}</i>${names[i]}</button>`).join('');
  D('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0);});
}
function render(){
  document.documentElement.lang=LI()?'en':'zh-CN';
  renderNav();
  if(tab!=='today') stopRoastTicker();
  if(tab==='today')viewToday();else if(tab==='board')viewBoard();else if(tab==='reward')viewReward();else viewReport();
  D('fab').style.display=tab==='today'?'grid':'none';
}
function sheet(html){const s=D('sheet');s.innerHTML='<div class="grab"></div>'+html;s.classList.add('on');D('scrim').classList.add('on');}
function closeSheet(){D('sheet').classList.remove('on');D('scrim').classList.remove('on');}
D('scrim').onclick=closeSheet;
D('fab').onclick=()=>openAdd(null);

(async function init(){
  const raw=await sGet(KEY);
  if(raw){try{const o=JSON.parse(raw);S=Object.assign(defaults(),o);S.set=Object.assign(defaults().set,o.set||{});S.streak=Object.assign({cur:0,best:0,noticed:null},o.streak||{});}catch(e){}}
  ensureDefaultTasks();
  recomputeStreak();maybeArchiveWeek();render();
  if(S.set.public)sSet('dglb:'+S.uid,JSON.stringify({name:S.set.name,pts:S.points,streak:S.streak.cur,ts:Date.now()}),true);
})();
</script>
